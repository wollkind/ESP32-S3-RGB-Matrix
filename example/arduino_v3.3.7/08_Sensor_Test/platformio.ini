[platformio]
; The sketch folder itself is the source dir: PlatformIO only converts .ino
; files found at the top level of src_dir, so each example is its own project.
src_dir = .
extra_configs = ../common.ini

[env:esp32s3]
lib_deps =
    ${common.lib_deps}
    adafruit/Adafruit SHTC3 Library@^1.0.2
    adafruit/Adafruit Unified Sensor@^1.1.14
    lewisxhe/SensorLib@^0.4.1
