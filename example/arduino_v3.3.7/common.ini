; ---------------------------------------------------------------------------
; Shared PlatformIO settings for the Waveshare ESP32-S3-RGB-Matrix examples.
;
; Every example folder has its own platformio.ini that pulls this file in via
;   [platformio]
;   extra_configs = ../common.ini
; so open the *example folder* (not this one) as the PlatformIO project.
; ---------------------------------------------------------------------------

[common]
; Libraries every example needs. The HUB75 driver itself is vendored into each
; example folder, but it inherits from Adafruit_GFX.
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.11

[env]
; Arduino-ESP32 3.3.x (here 3.3.11) is only available through the pioarduino platform fork;
; the registry's `espressif32` tops out at core 2.0.17 and will not build these.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1

; Board is an ESP32-S3-N32R16: 32 MB flash + 16 MB octal PSRAM.
; If flashing fails or PSRAM is not detected, try memory_type = opi_opi
; (some N32 modules ship octal flash instead of quad).
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = ../partitions_32MB.csv
board_upload.flash_size = 32MB
board_upload.maximum_size = 4194304

; The HUB75 driver #includes platforms/esp32s3/gdma_lcd_parallel16.cpp itself
; (Arduino IDE never compiles sketch subfolders), so keep it out of the build
; or every symbol in it is defined twice.
build_src_filter = +<*> -<platforms/>

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0              ; the Arduino IDE always defines this; some libs require it
    -DARDUINO_USB_CDC_ON_BOOT=1      ; Serial goes to the native USB-C port
    -DARDUINO_USB_MODE=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize

lib_deps = ${common.lib_deps}
